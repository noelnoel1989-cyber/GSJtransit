<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transit Dashboard</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .block {
      border: 1px solid #222;
      padding: 12px;
      border-radius: 8px;
    }

    /* Force M11 to appear on the right side */
    .block.m11-block {
      grid-column: 2;
      grid-row: auto;
    }

    .spacer {
      display: none;
    }

    .title {
      font-size: 18px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .direction-group {
      margin-bottom: 12px;
    }

    .direction-label {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 5px;
      font-style: italic;
    }

    .item {
      font-size: 18px;
      margin: 4px 0;
      padding: 6px 8px;
      border-radius: 4px;
      display: block;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red-text { color: #ff4d4d; }

    .red-bg {
      background-color: #ff4d4d;
      color: white;
    }

    .blue-bg {
      background-color: #4da6ff;
      color: white;
    }

    .orange-bg {
      background-color: #ff9933;
      color: white;
    }

    .green-bg {
      background-color: #00dd44;
      color: white;
    }

    .purple-bg {
      background-color: #9933ff;
      color: white;
    }

    .next {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div id="next" class="next">Loading...</div>
<div class="grid" id="grid"></div>

<script>

const API = "/.netlify/functions/transit";

function getColorClass(trainColor) {
  if (trainColor === "red") return "red-bg";
  if (trainColor === "blue") return "blue-bg";
  if (trainColor === "orange") return "orange-bg";
  if (trainColor === "green") return "green-bg";
  if (trainColor === "purple") return "purple-bg";
  return "red-bg";
}

function getMinColor(mins) {
  if (mins <= 5) return "green";
  if (mins <= 12) return "yellow";
  return "red-text";
}

function getLine(name) {
  if (!name) return "Unknown";
  if (name.includes("1")) return "1";
  if (name.includes("A")) return "A";
  if (name.includes("B")) return "B";
  if (name.includes("C")) return "C";
  if (name.includes("D")) return "D";
  if (name.includes("M7")) return "M7";
  if (name.includes("M11")) return "M11";
  return name;
}

function getDirection(name) {
  if (name.includes("Uptown")) return "Uptown";
  if (name.includes("Downtown")) return "Downtown";
  if (name.includes("Southbound")) return "Southbound";
  return "";
}

function createBlockHtml(line, directionGroups) {
  const isM11 = line === "M11";
  const blockClass = isM11 ? 'block m11-block' : 'block';
  
  let blockHtml = '<div class="' + blockClass + '"><div class="title">' + line + '</div>';

  directionGroups.forEach(dirGroup => {
    const trains = dirGroup.trains.slice(0, 2);
    
    blockHtml += '<div class="direction-group">';
    blockHtml += '<div class="direction-label">' + dirGroup.direction + '</div>';

    trains.forEach(t => {
      blockHtml += '<div class="item ' + getColorClass(t.color) + ' ' + getMinColor(t.mins) + '">' +
        t.mins + ' min' +
        '</div>';
    });

    blockHtml += '</div>';
  });

  blockHtml += '</div>';
  return blockHtml;
}

async function load() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    if (!data || !data.length) {
      document.getElementById("next").innerText = "No data available";
      return;
    }

    const groups = {};

    data.forEach(d => {
      const line = getLine(d.name);
      const direction = getDirection(d.name);
      const key = line + "-" + direction;
      
      if (!groups[key]) {
        groups[key] = {
          line: line,
          direction: direction,
          trains: [],
          color: d.color
        };
      }
      groups[key].trains.push(d);
    });

    Object.keys(groups).forEach(key => {
      groups[key].trains.sort((a, b) => a.mins - b.mins);
    });

    const all = Object.values(groups).flatMap(g => g.trains);
    all.sort((a, b) => a.mins - b.mins);

    const next = all[0];

    document.getElementById("next").innerHTML =
      '<span class="' + getColorClass(next.color) + '">' +
      'NEXT: ' + next.name + ' — ' + next.mins + ' min' +
      '</span>';

    const lineGroups = {};
    Object.values(groups).forEach(group => {
      const line = group.line;
      if (!lineGroups[line]) {
        lineGroups[line] = [];
      }
      lineGroups[line].push(group);
    });

    let html = "";
    
    const allLines = ["1", "A", "B", "C", "D", "M7", "M11"];
    allLines.forEach(line => {
      if (lineGroups[line]) {
        html += createBlockHtml(line, lineGroups[line]);
      }
    });

    document.getElementById("grid").innerHTML = html;

  } catch (e) {
    console.error("Error:", e);
    document.getElementById("next").innerText = "Error loading data";
  }
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
