<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NYC Bus Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🚌</text></svg>">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .block {
      border: 1px solid #222;
      padding: 12px;
      border-radius: 8px;
    }

    .title {
      font-size: 24px;
      opacity: 0.7;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .direction-group {
      margin-bottom: 12px;
    }

    .direction-label {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 5px;
      font-style: italic;
    }

    .item {
      font-size: 18px;
      margin: 4px 0;
      padding: 6px 8px;
      border-radius: 4px;
      display: block;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red-text { color: #ff4d4d; }

    .red-bg { background-color: #ff4d4d; color: white; }
    .blue-bg { background-color: #4da6ff; color: white; }
    .orange-bg { background-color: #ff9933; color: white; }
    .green-bg { background-color: #00dd44; color: white; }
    .purple-bg { background-color: #9933ff; color: white; }
    .yellow-bg { background-color: #ffd400; color: black; }

    .next {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
