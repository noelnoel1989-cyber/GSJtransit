<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transit Dashboard</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }

    .block {
      border: 1px solid #222;
      padding: 20px;
      border-radius: 12px;
    }

    .title {
      font-size: 26px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .direction-group {
      margin-bottom: 20px;
    }

    .direction-label {
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 8px;
      font-style: italic;
    }

    .item {
      font-size: 28px;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 6px;
      display: block;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red-text { color: #ff4d4d; }

    /* Train line colors */
    .red-bg {
      background-color: #ff4d4d;
      color: white;
    }

    .blue-bg {
      background-color: #4da6ff;
      color: white;
    }

    .orange-bg {
      background-color: #ff9933;
      color: white;
    }

    .next {
      font-size: 70px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .debug {
      font-size: 12px;
      color: #666;
      margin-top: 40px;
      border-top: 1px solid #333;
      padding-top: 20px;
    }
  </style>
</head>

<body>

<div id="next" class="next">Loading...</div>

<div class="grid" id="grid"></div>

<div class="debug" id="debug"></div>

<script>

// Use relative path instead of full domain
const API = "/.netlify/functions/transit";

function getColorClass(trainColor) {
  if (trainColor === "red") return "red-bg";
  if (trainColor === "blue") return "blue-bg";
  if (trainColor === "orange") return "orange-bg";
  return "red-bg"; // default
}

function getMinColor(mins) {
  if (mins <= 5) return "green";
  if (mins <= 12) return "yellow";
  return "red-text";
}

// Get the line number from the name
function getLine(name) {
  if (!name) return "Unknown";

  if (name.includes("1")) return "1";
  if (name.includes("A")) return "A";
  if (name.includes("B")) return "B";
  if (name.includes("C")) return "C";
  if (name.includes("D")) return "D";

  return name;
}

// Get direction (Uptown or Downtown)
function getDirection(name) {
  if (name.includes("Uptown")) return "Uptown";
  if (name.includes("Downtown")) return "Downtown";
  return "";
}

function debug(msg) {
  console.log(msg);
  const debugEl = document.getElementById("debug");
  if (debugEl) {
    debugEl.innerHTML += msg + "<br>";
  }
}

async function load() {
  try {
    debug(`Fetching from: ${API}`);
    const res = await fetch(API);
    debug(`Response status: ${res.status}`);
    
    const data = await res.json();
    debug(`Received data length: ${data.length}`);

    if (!data || !data.length) {
      document.getElementById("next").innerText = "No data available";
      debug("No data returned from API");
      return;
    }

    debug(`Processing ${data.length} items`);

    // Group by line and direction
    const groups = {};

    data.forEach(d => {
      const line = getLine(d.name);
      const direction = getDirection(d.name);
      const key = `${line}-${direction}`;
      
      if (!groups[key]) {
        groups[key] = {
          line: line,
          direction: direction,
          trains: [],
          color: d.color
        };
      }
      groups[key].trains.push(d);
    });

    // Sort each group by minutes
    Object.keys(groups).forEach(key => {
      groups[key].trains.sort((a, b) => a.mins - b.mins);
    });

    // find global next (soonest arrival)
    const all = Object.values(groups).flatMap(g => g.trains);
    all.sort((a, b) => a.mins - b.mins);

    const next = all[0];

    document.getElementById("next").innerHTML =
      `<span class="${getColorClass(next.color)}">
        NEXT: ${next.name} — ${next.mins} min
      </span>`;

    // render grid - group by line only (not by direction)
    const lineGroups = {};
    Object.values(groups).forEach(group => {
      const line = group.line;
      if (!lineGroups[line]) {
        lineGroups[line] = [];
      }
      lineGroups[line].push(group);
    });

    const html = Object.keys(lineGroups).sort().map(line => {
      const directionGroups = lineGroups[line];
      const color = directionGroups[0].color; // All directions of same line have same color

      const directionsHtml = directionGroups.map(dirGroup => {
        const trains = dirGroup.trains.slice(0, 2); // Get first 2 trains
        
        return `
          <div class="direction-group">
            <div class="direction-label">${dirGroup.direction}</div>
            ${trains.map(t =>
              `<div class="item ${getColorClass(t.color)} ${getMinColor(t.mins)}">
                ${t.mins} min
              </div>`
            ).join("")}
          </div>
        `;
      }).join("");

      return `
        <div class="block">
          <div class="title">${line}</div>
          ${directionsHtml}
        </div>
      `;
    }).join("");

    document.getElementById("grid").innerHTML = html;
    debug("Rendering complete");
  } catch (e) {
    console.error("Error:", e);
    debug(`ERROR: ${e.message}`);
  }
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
