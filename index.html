<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transit Dashboard</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }

    .block {
      border: 1px solid #222;
      padding: 20px;
      border-radius: 12px;
    }

    .title {
      font-size: 26px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .item {
      font-size: 28px;
      margin: 8px 0;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red { color: #ff4d4d; }

    .next {
      font-size: 70px;
      font-weight: bold;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

<div id="next" class="next">Loading...</div>

<div class="grid" id="grid"></div>

<script>

const API = "https://gsjtransit.netlify.app/.netlify/functions/transit";

function color(m) {
  if (m <= 5) return "green";
  if (m <= 12) return "yellow";
  return "red";
}

// normalize line name from backend text
function getLine(name) {
  if (!name) return "Unknown";

  if (name.includes("1")) return "1";
  if (name.includes("B")) return "B";
  if (name.includes("C")) return "C";
  if (name.includes("M7")) return "M7";
  if (name.includes("M11")) return "M11";
  if (name.includes("M96")) return "M96";

  return name;
}

async function load() {
  const res = await fetch(API);
  const data = await res.json();

  if (!data || !data.length) {
    document.getElementById("next").innerText = "No data available";
    return;
  }

  // group by line
  const groups = {};

  data.forEach(d => {
    const line = getLine(d.name);
    if (!groups[line]) groups[line] = [];
    groups[line].push(d);
  });

  // sort each group
  Object.keys(groups).forEach(line => {
    groups[line].sort((a, b) => a.mins - b.mins);
  });

  // find global next
  const all = Object.values(groups).flat();
  all.sort((a, b) => a.mins - b.mins);

  const next = all[0];

  document.getElementById("next").innerHTML =
    `<span class="${color(next.mins)}">
      NEXT: ${next.name} — ${next.mins} min
    </span>`;

  // render grid
  const html = Object.keys(groups).map(line => {
    const items = groups[line].slice(0, 3);

    return `
      <div class="block">
        <div class="title">${line}</div>
        ${items.map(i =>
          `<div class="item ${color(i.mins)}">
            ${i.mins} min
          </div>`
        ).join("")}
      </div>
    `;
  }).join("");

  document.getElementById("grid").innerHTML = html;
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
