<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transit Dashboard</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .title {
      font-size: 24px;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .next {
      font-size: 90px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .item {
      font-size: 36px;
      margin: 10px 0;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red { color: #ff4d4d; }

    .loading {
      opacity: 0.6;
      font-size: 40px;
    }
  </style>
</head>

<body>

  <div class="title">NEXT DEPARTURE</div>
  <div id="next" class="next loading">Loading...</div>

  <div class="title">NEXT 3 TRAINS</div>
  <div id="list" class="loading">Loading...</div>

<script>

const API = "https://gsjtransit.netlify.app/.netlify/functions/transit";

function color(m) {
  if (m <= 5) return "green";
  if (m <= 12) return "yellow";
  return "red";
}

async function load() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    if (!data || !data.length) {
      document.getElementById("next").innerText = "No data available";
      document.getElementById("list").innerText = "";
      return;
    }

    // sort by fastest arrival
    data.sort((a, b) => a.mins - b.mins);

    // top 3 only
    const top3 = data.slice(0, 3);

    // main display (next train)
    const next = top3[0];

    document.getElementById("next").innerHTML =
      `<span class="${color(next.mins)}">
        ${next.name} — ${next.mins} min
      </span>`;

    // list (top 3)
    document.getElementById("list").innerHTML =
      top3.map((d, i) =>
        `<div class="item ${color(d.mins)}">
          ${i === 0 ? "NEXT → " : ""}
          ${d.name} — ${d.mins} min
        </div>`
      ).join("");

  } catch (err) {
    document.getElementById("next").innerText = "API error";
    document.getElementById("list").innerText = "";
    console.error(err);
  }
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
