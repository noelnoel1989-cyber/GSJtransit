<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transit Dashboard</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }

    .block {
      border: 1px solid #222;
      padding: 20px;
      border-radius: 12px;
    }

    .title {
      font-size: 26px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .item {
      font-size: 28px;
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red-text { color: #ff4d4d; }

    /* Train line colors */
    .red-bg {
      background-color: #ff4d4d;
      color: white;
    }

    .blue-bg {
      background-color: #4da6ff;
      color: white;
    }

    .orange-bg {
      background-color: #ff9933;
      color: white;
    }

    .next {
      font-size: 70px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .debug {
      font-size: 12px;
      color: #666;
      margin-top: 40px;
      border-top: 1px solid #333;
      padding-top: 20px;
    }
  </style>
</head>

<body>

<div id="next" class="next">Loading...</div>

<div class="grid" id="grid"></div>

<div class="debug" id="debug"></div>

<script>

// Use relative path instead of full domain
const API = "/.netlify/functions/transit";

function getColorClass(trainColor) {
  if (trainColor === "red") return "red-bg";
  if (trainColor === "blue") return "blue-bg";
  if (trainColor === "orange") return "orange-bg";
  return "red-bg"; // default
}

function getMinColor(mins) {
  if (mins <= 5) return "green";
  if (mins <= 12) return "yellow";
  return "red-text";
}

// normalize line name from backend text
function getLine(name) {
  if (!name) return "Unknown";

  if (name.includes("1")) return "1";
  if (name.includes("A")) return "A";
  if (name.includes("B")) return "B";
  if (name.includes("C")) return "C";
  if (name.includes("D")) return "D";

  return name;
}

function debug(msg) {
  console.log(msg);
  const debugEl = document.getElementById("debug");
  if (debugEl) {
    debugEl.innerHTML += msg + "<br>";
  }
}

async function load() {
  try {
    debug(`Fetching from: ${API}`);
    const res = await fetch(API);
    debug(`Response status: ${res.status}`);
    
    const data = await res.json();
    debug(`Received data length: ${data.length}`);

    if (!data || !data.length) {
      document.getElementById("next").innerText = "No data available";
      debug("No data returned from API");
      return;
    }

    debug(`Processing ${data.length} items`);

    // group by line
    const groups = {};

    data.forEach(d => {
      const line = getLine(d.name);
      if (!groups[line]) groups[line] = [];
      groups[line].push(d);
    });

    debug(`Grouped into ${Object.keys(groups).length} lines`);

    // sort each group
    Object.keys(groups).forEach(line => {
      groups[line].sort((a, b) => a.mins - b.mins);
    });

    // find global next
    const all = Object.values(groups).flat();
    all.sort((a, b) => a.mins - b.mins);

    const next = all[0];

    document.getElementById("next").innerHTML =
      `<span class="${getColorClass(next.color)}">
        NEXT: ${next.name} — ${next.mins} min
      </span>`;

    // render grid
    const html = Object.keys(groups).map(line => {
      const items = groups[line].slice(0, 3);

      return `
        <div class="block">
          <div class="title">${line}</div>
          ${items.map(i =>
            `<div class="item ${getColorClass(i.color)}">
              ${i.name}: ${i.mins} min
            </div>`
          ).join("")}
        </div>
      `;
    }).join("");

    document.getElementById("grid").innerHTML = html;
    debug("Rendering complete");
  } catch (e) {
    console.error("Error:", e);
    debug(`ERROR: ${e.message}`);
  }
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
