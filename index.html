<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transit Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🚇</text></svg>">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .block {
      border: 1px solid #222;
      padding: 12px;
      border-radius: 8px;
    }

    .title {
      font-size: 18px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .direction-group {
      margin-bottom: 12px;
    }

    .direction-label {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 5px;
      font-style: italic;
    }

    .item {
      font-size: 18px;
      margin: 4px 0;
      padding: 6px 8px;
      border-radius: 4px;
      display: block;
    }

    .green { color: #00ff66; }
    .yellow { color: #ffd400; }
    .red-text { color: #ff4d4d; }

    .red-bg { background-color: #ff4d4d; color: white; }
    .blue-bg { background-color: #4da6ff; color: white; }
    .orange-bg { background-color: #ff9933; color: white; }
    .green-bg { background-color: #00dd44; color: white; }
    .purple-bg { background-color: #9933ff; color: white; }

    .next {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
<div id="next" class="next">Loading...</div>
<div class="grid" id="grid"></div>

<script>
var API = "/.netlify/functions/transit";

function getColorClass(color) {
  if (color === "red") return "red-bg";
  if (color === "blue") return "blue-bg";
  if (color === "orange") return "orange-bg";
  if (color === "green") return "green-bg";
  if (color === "purple") return "purple-bg";
  return "red-bg";
}

function getMinColor(mins) {
  if (mins <= 5) return "green";
  if (mins <= 12) return "yellow";
  return "red-text";
}

function getLine(name) {
  if (name.indexOf("1") !== -1) return "1";
  if (name.indexOf("A") !== -1) return "A";
  if (name.indexOf("B") !== -1) return "B";
  if (name.indexOf("C") !== -1) return "C";
  if (name.indexOf("D") !== -1) return "D";
  if (name.indexOf("M7") !== -1) return "M7";
  if (name.indexOf("M11") !== -1) return "M11";
  return name;
}

function getDirection(name) {
  if (name.indexOf("Uptown") !== -1) return "Uptown";
  if (name.indexOf("Downtown") !== -1) return "Downtown";
  if (name.indexOf("Southbound") !== -1) return "Southbound";
  return "";
}

function renderData(data) {
  if (!data || !data.length) {
    document.getElementById("next").innerText = "No data available";
    return;
  }

  var groups = {};

  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    var line = getLine(d.name);
    var direction = getDirection(d.name);
    var key = line + "-" + direction;
    
    if (!groups[key]) {
      groups[key] = {
        line: line,
        direction: direction,
        trains: [],
        color: d.color
      };
    }
    groups[key].trains.push(d);
  }

  var keys = Object.keys(groups);
  for (var k = 0; k < keys.length; k++) {
    var trains = groups[keys[k]].trains;
    trains.sort(function(a, b) {
      return a.mins - b.mins;
    });
  }

  var all = [];
  for (var k = 0; k < keys.length; k++) {
    var trains = groups[keys[k]].trains;
    for (var t = 0; t < trains.length; t++) {
      all.push(trains[t]);
    }
  }
  all.sort(function(a, b) {
    return a.mins - b.mins;
  });

  var next = all[0];
  var nextHtml = '<span class="' + getColorClass(next.color) + '">NEXT: ' + next.name + ' — ' + next.mins + ' min</span>';
  document.getElementById("next").innerHTML = nextHtml;

  var lineGroups = {};
  for (var k = 0; k < keys.length; k++) {
    var group = groups[keys[k]];
    var line = group.line;
    if (!lineGroups[line]) {
      lineGroups[line] = [];
    }
    lineGroups[line].push(group);
  }

  var lineOrder = ["1", "A", "B", "C", "D", "M7", "M11"];
  var html = "";
  
  for (var l = 0; l < lineOrder.length; l++) {
    var line = lineOrder[l];
    if (lineGroups[line]) {
      var directionGroups = lineGroups[line];
      html += '<div class="block"><div class="title">' + line + '</div>';

      for (var dg = 0; dg < directionGroups.length; dg++) {
        var dirGroup = directionGroups[dg];
        var trains = dirGroup.trains.slice(0, 2);
        html += '<div class="direction-group"><div class="direction-label">' + dirGroup.direction + '</div>';
        
        for (var tr = 0; tr < trains.length; tr++) {
          var t = trains[tr];
          html += '<div class="item ' + getColorClass(t.color) + ' ' + getMinColor(t.mins) + '">' + t.mins + ' min</div>';
        }
        
        html += '</div>';
      }
      
      html += '</div>';
    }
  }

  document.getElementById("grid").innerHTML = html;
}

function load() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", API, true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      var data = JSON.parse(xhr.responseText);
      renderData(data);
    } else {
      document.getElementById("next").innerText = "Error: " + xhr.status;
    }
  };
  xhr.onerror = function() {
    document.getElementById("next").innerText = "Connection error";
  };
  xhr.send();
}

load();
setInterval(load, 60000);
</script>

</body>
</html>
